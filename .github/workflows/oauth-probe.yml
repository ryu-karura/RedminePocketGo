# Redmine OAuth Probe: Redmine 7 の OAuth 2.0 プロバイダ（Doorkeeper）の実挙動を
# 探査し、結果をジョブサマリに出す（docs/plan.md フェーズ 10 第 1 タスク、
# docs/Design.md §14）。続けて、同じ起動済みスタックで運用スクリプト
# （redmine-seed-testdata.sh → test-stack.sh）を実行して検証する。
# stack-test.yml は GitHub に無活動で自動無効化されることがあり、こちらは push で
# 確実に動く。RedmineDocker は checkout して起動するのみで変更しない
# （CLAUDE.md §9-6）。Redmine の API キーは使わない（§9-1）。
name: Redmine OAuth Probe

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**", "ccr-*"]
    paths:
      - "scripts/redmine-oauth-probe.sh"
      - "scripts/redmine-seed-testdata.sh"
      - "scripts/test-stack.sh"
      - "server/stacktest/**"
      - ".github/workflows/oauth-probe.yml"

permissions:
  contents: read

concurrency:
  group: oauth-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Redmine 7 OAuth 探査
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Checkout RedmineDocker
        uses: actions/checkout@v4
        with:
          repository: ryu-karura/RedmineDocker
          ref: main
          path: redminedocker

      # RedmineDocker の scripts/generate-secrets.sh は `tr | head -c 24` が
      # SIGPIPE（tr: write error: Broken pipe）で失敗するため使わない
      # （RedmineDocker 側の不具合。本リポジトリでは変更しない — CLAUDE.md §9-6）。
      # 同じファイル名・形式（改行なし）でここで生成する。
      - name: RedmineDocker のシークレットを生成
        working-directory: redminedocker
        run: |
          mkdir -p secrets && chmod 700 secrets
          printf '%s' "$(openssl rand -hex 12)" > secrets/db_password.txt
          printf '%s' "$(openssl rand -hex 64)" > secrets/secret_key_base.txt
          chmod 600 secrets/*.txt

      - name: RedmineDocker 開発スタックを起動
        working-directory: redminedocker
        run: docker compose -f compose.dev.yaml up --build -d

      - name: redmine-web の healthy を待機
        working-directory: redminedocker
        run: |
          for _ in $(seq 1 120); do
            status="$(docker inspect --format '{{.State.Health.Status}}' redmine-web 2>/dev/null || echo unknown)"
            [ "${status}" = "healthy" ] && exit 0
            if [ "${status}" = "unhealthy" ]; then
              docker logs redmine-web
              exit 1
            fi
            sleep 5
          done
          echo "redmine-web が healthy になりませんでした（タイムアウト）" >&2
          docker logs redmine-web
          exit 1

      - name: OAuth 探査
        run: scripts/redmine-oauth-probe.sh

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: rmapp のシークレットを生成
        run: |
          bash scripts/generate-secrets.sh
          mkdir -p server/data

      - name: テストデータと OAuth トークンを用意（redmine-seed-testdata.sh）
        id: seed
        env:
          CI: "true"
        run: |
          token="$(scripts/redmine-seed-testdata.sh | tail -1 | cut -d= -f2-)"
          if [ -z "${token}" ]; then
            echo "アクセストークンを取得できませんでした" >&2
            exit 1
          fi
          echo "::add-mask::${token}"
          echo "access_token=${token}" >> "${GITHUB_OUTPUT}"

      - name: scripts/test-stack.sh を実行
        env:
          RMAPP_STACK_ACCESS_TOKEN: ${{ steps.seed.outputs.access_token }}
        run: scripts/test-stack.sh

      - name: 失敗時の redmine-web ログ
        if: failure()
        run: docker logs --tail 15 redmine-web 2>&1 | cut -c1-200

      - name: 後片付け
        if: always()
        working-directory: redminedocker
        run: docker compose -f compose.dev.yaml down -v
