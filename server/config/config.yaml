# rmapp 設定ファイル（雛形）
#
# 起動時に一度だけ読み込まれ、その場で検証される。必須キーが欠けている
# 場合は、キー名を示して起動を中止する。
# 優先順位: コマンドライン引数 > 環境変数（接頭辞 RMAPP_）> このファイル > 既定値
#   環境変数名はキーの階層を "_" で結んで大文字化したもの。
#   例: session.idleTimeoutHours → RMAPP_SESSION_IDLETIMEOUTHOURS
# 各項目の説明は docs/Design.md §10、設定手順は docs/Setup.md を参照。

# ---- サーバー ----
listen: ":8090"        # 待ち受けアドレス。Redmine 開発スタックの 8080 と重ねない
baseURL: ""            # サブパス配信する場合のパス。空ならルート配信
webroot: "../app"      # SPA の配置先。server/ をカレントディレクトリとして起動する前提の相対パス
serveStatic: true      # SPA を本サーバーから配信するか
noCache: true          # キャッシュ抑止ヘッダーを全レスポンスに付与するか
logLevel: "info"       # debug / info / warn / error
trustedProxies:        # X-Forwarded-For を信用する直接の接続元（CIDR か単一 IP）。リバース
  - "127.0.0.0/8"      # プロキシ（Host Apache）のアドレスを列挙する。空配列 [] ならヘッダーを
  - "::1/128"          # 一切信用しない（レート制限は接続元アドレス単位になる）

# ---- セッション（二軸タイムアウト）----
session:
  idleTimeoutHours: 168      # 操作がない場合の失効（7 日）
  absoluteTimeoutHours: 720  # ログインからの絶対失効（30 日）
  secureCookie: true         # Secure 属性。localhost 検証時のみ false にする
  cookieName: "rmapp_session"
  secretFile: "../secrets/session_key.txt"  # 必須。scripts/generate-secrets.sh が生成

# ---- 暗号化（OAuth トークン保管庫）----
crypto:
  kekFile: "../secrets/kek.txt"  # 必須。失うと保存済みトークンは復号不能（全員が再ログインすれば復旧）
  keyVersion: 1                     # 鍵ローテーションの世代

# ---- Redmine 接続 ----
redmine:
  baseURL: "http://localhost:8080"  # 必須。Redmine の起点 URL
  subURI: "/redmine"                # RedmineDocker の REDMINE_SUBURI と一致させる
  timeoutSeconds: 10
  maxRetries: 2
  maxConcurrency: 8
  pageSize: 100
  # ブラウザから見える Redmine の起点 URL（/oauth/authorize への遷移に使う）。
  # 空なら baseURL と同じ。コンテナ内部名で接続し公開 URL が別になる本番では必須
  publicBaseURL: ""
  # Redmine に登録した OAuth アプリケーション（管理 → アプリケーション。docs/Setup.md）。
  # Redmine の API キーは一切使わない。Client Secret は値ではなくファイルで渡す
  oauth:
    clientId: "REPLACE_WITH_REDMINE_CLIENT_ID"   # 必須。Redmine が発行する Client ID
    clientSecretFile: "../secrets/redmine_oauth_client_secret.txt"  # 必須。空だと起動中止
    redirectURI: "http://localhost:8090/api/auth/callback"  # 必須。Redmine の登録値と完全一致。公開 URL + /api/auth/callback
    scopes:                  # 必須。Redmine の権限名。Redmine の登録値と一致させる（admin は不可）
      - view_project
      - view_issues
      - add_issues
      - edit_issues
      - add_issue_notes
      - view_members
    stateTTLMinutes: 10      # 認可要求（state・PKCE）の有効期間
    refreshSkewSeconds: 60   # アクセストークンの期限の何秒前からリフレッシュするか

# ---- データベース ----
database:
  dsn: "file:data/rmapp.db?_pragma=foreign_keys(1)"  # 必須。SQLite の接続文字列（server/ が
    # カレントディレクトリの前提。docs/Setup.md §7 の mkdir -p data と対応）

# ---- 機能の有効化 ----
features:
  mapEnabled: false        # 地図機能（将来。指示があるまで false）
  issueCreate: true        # チケット作成の可否
